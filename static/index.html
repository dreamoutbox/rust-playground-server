<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Playground — Powered by Firecracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <div class="header-brand">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 19.5h20L12 2zm0 4.8L18.4 18H5.6L12 6.8z" />
                </svg>
            </div>
            <span class="brand-title">Rust Playground</span>
            <span class="brand-badge">
                <span class="status-dot"></span>
                Firecracker MicroVM
            </span>
        </div>

        <div class="header-actions">
            <button id="btn-reset" class="btn-secondary" title="Reset code snippet">Reset</button>
            <button id="btn-run" class="btn-run" title="Compile and execute inside microVM (Ctrl+Enter)">
                <span id="run-spinner" class="spinner" style="display: none;"></span>
                <span id="run-label">Run</span>
                <span class="kbd-hint">Ctrl+Enter</span>
            </button>
        </div>
    </header>

    <main>
        <div id="editor-container">
            <textarea id="code-fallback" spellcheck="false"></textarea>
        </div>

        <div id="resizer" class="resizer"></div>

        <section id="output-panel">
            <div class="output-header">
                <span>Output Console</span>
                <div class="output-status">
                    <span id="exec-status" class="status-badge idle">Ready</span>
                    <span id="exec-time" style="display: none; color: var(--text-muted); font-size: 0.75rem;"></span>
                </div>
            </div>
            <pre
                id="output-content"><span class="placeholder-text">Click "Run" or press Ctrl+Enter to compile and run in a microVM...</span></pre>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
